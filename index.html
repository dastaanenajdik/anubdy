<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Secret Surprise 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importing elegant fonts for a polished look -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Custom styles for animations and specific aesthetics */
        body {
            font-family: 'Poppins', sans-serif;
            /* Beautiful soft pink/peach gradient background */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-image: radial-gradient(circle at top right, #ffe6ea, transparent),
                              radial-gradient(circle at bottom left, #fad0c4, transparent);
            min-height: 100vh;
            overflow: hidden; /* Hide scrollbars for floating elements */
        }

        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        /* Glassmorphism effect for the box */
        .glass-box {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(255, 182, 193, 0.3);
        }

        /* Floating animation for background decorations */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-float-delayed {
            animation: float 5s ease-in-out infinite;
            animation-delay: 2s;
        }
        
        /* Input focus glowing effect */
        input:focus {
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center relative">

    <!-- Decorative floating elements in the background -->
    <div class="absolute top-10 left-10 text-4xl animate-float opacity-70">🌸</div>
    <div class="absolute bottom-20 left-20 text-3xl animate-float-delayed opacity-60">✨</div>
    <div class="absolute top-20 right-20 text-5xl animate-float opacity-50">🎀</div>
    <div class="absolute bottom-10 right-10 text-4xl animate-float-delayed opacity-70">🌷</div>
    <div class="absolute top-1/2 left-4 text-2xl animate-float opacity-40">✨</div>
    <div class="absolute top-1/3 right-12 text-2xl animate-float-delayed opacity-60">💖</div>

    <!-- Login Screen Container -->
    <div id="login-screen" class="glass-box rounded-3xl p-10 max-w-sm w-full mx-4 text-center relative z-10 transition-all duration-700 ease-in-out transform">
        
        <!-- Decorative Header -->
        <div class="mb-6">
            <h1 class="font-cursive text-5xl text-pink-600 mb-2">Hello, Beautiful</h1>
            <p class="text-gray-500 text-sm font-light">Enter the magic pin to unlock your surprise</p>
        </div>

        <!-- Password Input -->
        <div class="relative mb-6">
            <input type="password" id="pwd" placeholder="Enter PIN ✨" 
                class="w-full bg-white/70 border-2 border-pink-200 rounded-full px-6 py-3 text-center text-pink-600 text-lg tracking-widest placeholder-pink-300 focus:outline-none focus:border-pink-400 focus:bg-white transition-all duration-300">
        </div>

        <!-- Unlock Button -->
        <button onclick="checkPassword()" 
            class="w-full bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-medium rounded-full py-3 shadow-lg transform transition duration-300 hover:scale-105 active:scale-95 flex justify-center items-center gap-2">
            Unlock Magic 🗝️
        </button>

        <!-- Error Message (Hidden by default) -->
        <p id="error-msg" class="text-rose-500 text-sm mt-4 hidden animate-pulse font-medium">
            Oops! That's not the right PIN 🥺
        </p>
    </div>

    <!-- Success Screen (Hidden by default) -->
    <div id="success-screen" class="hidden glass-box rounded-3xl p-12 max-w-md w-full mx-4 text-center relative z-10">
        <div class="text-6xl mb-4">🎉</div>
        <h1 class="font-cursive text-6xl text-pink-600 mb-4">Success!</h1>
        <p class="text-gray-600 text-lg">
            Password matched perfectly.<br>
            Main surprise will go here! 💖
        </p>
    </div>

    <script>
        function checkPassword() {
            const passwordInput = document.getElementById("pwd").value;
            const loginScreen = document.getElementById("login-screen");
            const successScreen = document.getElementById("success-screen");
            const errorMsg = document.getElementById("error-msg");

            // Check if password is correct (1411)
            if (passwordInput === "1411") {
                // Hide error if it was showing
                errorMsg.classList.add("hidden");
                
                // Add a cute fade-out and scale-down effect to login
                loginScreen.style.opacity = '0';
                loginScreen.style.transform = 'scale(0.9)';
                
                // Wait for the animation to finish before hiding completely
                setTimeout(() => {
                    loginScreen.classList.add("hidden");
                    
                    // Show success screen with a pop animation
                    successScreen.classList.remove("hidden");
                    successScreen.style.opacity = '0';
                    successScreen.style.transform = 'scale(0.8)';
                    
                    // Trigger reflow
                    void successScreen.offsetWidth; 
                    
                    // Fade in success screen
                    successScreen.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    successScreen.style.opacity = '1';
                    successScreen.style.transform = 'scale(1)';
                }, 400);

            } else {
                // Show error message
                errorMsg.classList.remove("hidden");
                
                // Shake effect for wrong password
                loginScreen.classList.add("animate-[shake_0.5s_ease-in-out]");
                
                // Remove the class after animation completes so it can be applied again
                setTimeout(() => {
                    loginScreen.classList.remove("animate-[shake_0.5s_ease-in-out]");
                }, 500);
            }
        }
        
        // Custom Tailwind config injection for the shake animation
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-10px)' },
                            '50%': { transform: 'translateX(10px)' },
                            '75%': { transform: 'translateX(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
