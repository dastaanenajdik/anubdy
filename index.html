<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Surprise ✨</title>
    <!-- Premium Fonts load krne ke liye -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #1a1a2e;
            color: white;
            text-align: center;
            overflow: hidden; /* Scroll hide krne ke liye */
            transition: background-color 1s ease;
        }

        /* --- PAGE 1: PASSWORD SCREEN --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 192, 203, 0.3);
            width: 90%;
            max-width: 400px;
        }

        .login-box h2 {
            font-family: 'Pacifico', cursive;
            color: #ffb6c1;
            font-size: 28px;
            margin-bottom: 10px;
        }

        input {
            padding: 15px;
            font-size: 16px;
            border-radius: 12px;
            border: 2px solid #ffb6c1;
            outline: none;
            text-align: center;
            margin: 20px 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .unlock-btn {
            padding: 15px 30px;
            font-size: 16px;
            background: linear-gradient(45deg, #ff7eb3, #ff758c);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .unlock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 117, 140, 0.4);
        }

        #error-msg {
            color: #ff4d4d;
            margin-top: 15px;
            display: none;
            font-weight: bold;
        }

        /* --- PAGE 2: HAPPY BIRTHDAY SCREEN --- */
        #bday-screen {
            display: none; /* Starting me hide rhega */
            height: 100vh;
            width: 100vw;
            position: relative;
            /* Yahan photo lagani hai. Linear gradient usko 60% ke baad background me fade kr dega */
            background-image: 
                linear-gradient(to bottom, rgba(255, 230, 234, 0) 0%, rgba(255, 230, 234, 0) 50%, #ffe6ea 75%, #ffe6ea 100%),
                url('girl-photo.jpg'); /* YAHAN APNI PHOTO KA NAAM DALNA HAI */
            background-size: cover;
            background-position: center top;
            animation: fadeIn 2s ease-in;
        }

        .content-overlay {
            position: absolute;
            bottom: 5%; /* Text ko screen ke bottom hisse me rkhne ke liye */
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .date-bubble {
            background: white;
            color: #ff758c;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .title {
            font-family: 'Pacifico', cursive;
            color: #333;
            font-size: 45px;
            line-height: 1.2;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
        }

        .subtitle {
            font-size: 24px;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Start Tribute Button (Screenshot Reference) */
        .tribute-btn {
            background: linear-gradient(90deg, #8a98e8, #b6bdf8); /* Purple/Blue cute gradient */
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(138, 152, 232, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tribute-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #7887d6, #a1a9e5);
        }

        /* --- PAGE 3: TRIBUTE SCREEN (Abhi ke liye khali rakha hai) --- */
        #tribute-screen {
            display: none;
            height: 100vh;
            color: #333;
            padding: 50px 20px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- PAGE 1: Login -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Just for you... 🎀</h2>
            <p>Enter the secret PIN</p>
            <input type="password" id="pwd" placeholder="Enter PIN">
            <button class="unlock-btn" onclick="unlockSurprise()">Unlock 💖</button>
            <p id="error-msg">Oops! Galat PIN. Phir se try karo 🥺</p>
        </div>
    </div>

    <!-- PAGE 2: Happy Birthday Photo Screen -->
    <div id="bday-screen">
        <div class="content-overlay">
            <div class="date-bubble">14 • 11</div>
            <h1 class="title">Happy Birthday</h1>
            <h2 class="subtitle">Tingu Mingu 🌸🥺</h2>
            
            <button class="tribute-btn" onclick="startTribute()">
                Start the tribute ➜
            </button>
        </div>
    </div>

    <!-- PAGE 3: The Tribute (Next part me banayenge) -->
    <div id="tribute-screen">
        <h2>Yay! Tum next page par aa gayi! 🎉</h2>
        <p>Yahan par hum unki story, photos aur baaki cheezein add karenge.</p>
    </div>

    <script>
        function unlockSurprise() {
            var password = document.getElementById("pwd").value;
            
            if (password === "1411") {
                // Page 1 hide karo
                document.getElementById("login-screen").style.display = "none";
                
                // Background color light pink set karo
                document.body.style.backgroundColor = "#ffe6ea"; 
                
                // Page 2 show karo
                document.getElementById("bday-screen").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function startTribute() {
            // Page 2 hide karo
            document.getElementById("bday-screen").style.display = "none";
            
            // Page 3 show karo
            document.getElementById("tribute-screen").style.display = "block";
        }
    </script>

</body>
</html>
