<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Secret Surprise 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-image: radial-gradient(circle at top right, #ffe6ea, transparent),
                              radial-gradient(circle at bottom left, #fad0c4, transparent);
            min-height: 100vh;
            overflow: hidden; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px 0 rgba(255, 182, 193, 0.4);
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-float-delayed {
            animation: float 5s ease-in-out infinite;
            animation-delay: 2s;
        }
        
        input:focus {
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- Floating Hearts and Sparkles -->
    <div class="absolute top-10 left-10 text-4xl animate-float opacity-70">🌸</div>
    <div class="absolute bottom-20 left-20 text-3xl animate-float-delayed opacity-60">✨</div>
    <div class="absolute top-20 right-20 text-5xl animate-float opacity-50">🎀</div>
    <div class="absolute bottom-10 right-10 text-4xl animate-float-delayed opacity-70">💖</div>
    <div class="absolute top-1/2 left-8 text-2xl animate-float opacity-40">✨</div>
    <div class="absolute top-1/3 right-12 text-3xl animate-float-delayed opacity-60">🌷</div>

    <!-- Password Screen Container -->
    <div id="login-screen" class="glass-box rounded-3xl p-10 max-w-sm w-full mx-4 text-center relative z-10 transition-all duration-700 ease-in-out">
        
        <div class="mb-6">
            <h1 class="font-cursive text-5xl text-pink-600 mb-2 mt-2">Hello, Beautiful</h1>
            <p class="text-gray-600 text-sm font-medium mt-3">Apna secret magic PIN dalo... 🤫</p>
        </div>

        <div class="relative mb-6">
            <input type="password" id="pwd" placeholder="Enter PIN ✨" 
                class="w-full bg-white/70 border-2 border-pink-200 rounded-full px-6 py-3 text-center text-pink-500 text-xl tracking-widest placeholder-pink-300 focus:outline-none focus:border-pink-400 focus:bg-white transition-all duration-300">
        </div>

        <button onclick="checkPassword()" 
            class="w-full bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-semibold text-lg rounded-full py-3 shadow-lg transform transition duration-300 hover:scale-105 active:scale-95 flex justify-center items-center gap-2">
            Surprise Dekho 🎁
        </button>

        <p id="error-msg" class="text-rose-500 text-sm mt-4 hidden animate-pulse font-semibold">
            Oops! Galat PIN daal diya 🥺
        </p>
    </div>

    <!-- Main Content (Hidden by default) -->
    <div id="success-screen" class="hidden glass-box rounded-3xl p-12 max-w-md w-full mx-4 text-center relative z-10">
        <div class="text-6xl mb-4 animate-bounce">🎉</div>
        <h1 class="font-cursive text-6xl text-pink-600 mb-4">Yaaay!</h1>
        <p class="text-gray-700 text-lg font-medium">
            Password bilkul sahi hai!<br>
            <span class="text-pink-500 mt-2 block">Humara next step yahan add hoga 💖</span>
        </p>
    </div>

    <script>
        function checkPassword() {
            const passwordInput = document.getElementById("pwd").value;
            const loginScreen = document.getElementById("login-screen");
            const successScreen = document.getElementById("success-screen");
            const errorMsg = document.getElementById("error-msg");

            // Checking the PIN
            if (passwordInput === "1411") {
                errorMsg.classList.add("hidden");
                
                // Fade out login screen
                loginScreen.style.opacity = '0';
                loginScreen.style.transform = 'scale(0.9)';
                
                setTimeout(() => {
                    loginScreen.classList.add("hidden");
                    
                    // Show and animate success screen
                    successScreen.classList.remove("hidden");
                    successScreen.style.opacity = '0';
                    successScreen.style.transform = 'scale(0.8)';
                    
                    // Force a browser repaint
                    void successScreen.offsetWidth; 
                    
                    successScreen.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    successScreen.style.opacity = '1';
                    successScreen.style.transform = 'scale(1)';
                }, 400);

            } else {
                // Show error message and shake box
                errorMsg.classList.remove("hidden");
                loginScreen.classList.add("shake-animation");
                
                // Remove class after animation to allow it again
                setTimeout(() => {
                    loginScreen.classList.remove("shake-animation");
                }, 500);
            }
        }
    </script>
</body>
</html>
