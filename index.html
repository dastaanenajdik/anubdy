<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; 
            background-color: #ffe6ea;
        }

        /* --- DECORATIVE PAGE 1: LOGIN SCREEN --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffdde1, #ffc3a0);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 45px 35px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3), inset 0 0 15px rgba(255,255,255,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        .glass-box::before {
            content: '✨';
            position: absolute;
            top: -20px;
            left: -10px;
            font-size: 40px;
            animation: floatAnim 3s infinite ease-in-out;
        }
        
        .glass-box::after {
            content: '🎀';
            position: absolute;
            bottom: -20px;
            right: -10px;
            font-size: 40px;
            animation: floatAnim 4s infinite ease-in-out reverse;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        .glass-box h2 {
            font-family: 'Pacifico', cursive;
            color: #d90429;
            font-size: 34px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.9);
        }

        .glass-box p {
            color: #4a0e4e;
            font-weight: 700;
            margin-bottom: 25px;
            font-size: 16px;
        }

        input {
            padding: 16px;
            font-size: 18px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            outline: none;
            text-align: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #d90429;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .unlock-btn {
            padding: 16px 30px;
            font-size: 18px;
            background: linear-gradient(45deg, #ff4d6d, #ff7eb3);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 900;
            width: 100%;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
            transition: all 0.3s;
        }

        .unlock-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(255, 77, 109, 0.6);
        }

        #error-msg {
            color: #d90429;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            background: rgba(255,255,255,0.8);
            padding: 5px;
            border-radius: 5px;
        }

        /* --- MAIN APP CONTAINER --- */
        #main-app {
            display: none; 
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none; 
        }
        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- SLIDE 1: WALLPAPER BACKGROUND --- */
       /* --- SLIDE 1: FULL WALLPAPER WITH FADE FADING EFFECT --- */
        #slide-1 {
            background-image: 
                /* Upar 0% opacity (transparent), neeche aate-aate 100% solid pink (#ffe6ea) ho jayega */
                linear-gradient(to bottom, rgba(255, 230, 234, 0) 0%, rgba(255, 230, 234, 0.3) 40%, rgba(255, 230, 234, 1) 95%),
                url('bg-photo.jpg'); /* <--- YAHAN APNI PHOTO KA EXACT NAAM LIKHO */
            background-size: cover; /* Photo ko pure screen par failane ke liye */
            background-position: center top; /* Photo ka top hissa focus me rakhne ke liye */
            background-repeat: no-repeat;
        }

        .content-overlay {
            position: absolute;
            bottom: 12%; 
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .date-bubble {
            background: white;
            color: #d90429;
            padding: 8px 25px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .title {
            font-family: 'Pacifico', cursive;
            color: #d90429; 
            font-size: 55px; 
            margin-bottom: 5px;
            text-align: center;
            line-height: 1.1;
            /* White outline taaki dark background me bhi pop kare */
            text-shadow: 
                -2px -2px 0 #fff,  
                 2px -2px 0 #fff,
                -2px  2px 0 #fff,
                 2px  2px 0 #fff,
                 0px  5px 15px rgba(255,255,255,0.9);
        }

        .subtitle {
            font-size: 28px; 
            color: #ff9a9e; 
            font-weight: 900;
            margin-bottom: 35px;
            text-shadow: 
                -1px -1px 0 #fff,  
                 1px -1px 0 #fff,
                -1px  1px 0 #fff,
                 1px  1px 0 #fff,
                 2px 2px 5px rgba(0,0,0,0.5);
        }

        .tribute-btn {
            background: linear-gradient(90deg, #8a98e8, #b6bdf8);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 18px;
            border-radius: 30px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(138, 152, 232, 0.6);
            transition: all 0.3s ease;
        }

        .tribute-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #7887d6, #a1a9e5);
        }

        /* --- SLIDE 2: NEW MEMORY PHOTO --- */
        #slide-2 {
            background: #fff0f3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        #slide-2 h2 {
            color: #d90429;
            font-family: 'Pacifico', cursive;
            font-size: 40px;
            margin-bottom: 15px;
        }

        /* Image styling */
        .slide-img {
            width: 80%;
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 15px 25px rgba(217, 4, 41, 0.2);
            margin-bottom: 20px;
            border: 8px solid white;
            transform: rotate(-3deg); 
            transition: transform 0.4s;
        }

        .slide-img:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .memory-text {
            font-size: 18px;
            font-weight: 700;
            color: #4a0e4e;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        /* --- PAGINATION (Bottom Dots) --- */
        .dots-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: rgba(255,255,255,0.5); /* Semi transparent white */
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .dot.active {
            width: 28px;
            background-color: #8a98e8; 
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(138, 152, 232, 0.8);
        }
    </style>
</head>
<body>

    <!-- SCREEN 1 -->
    <div id="login-screen">
        <div class="glass-box">
            <h2>Just for you...</h2>
            <p>Enter the secret PIN to unlock</p>
            <input type="password" id="pwd" placeholder="Enter PIN (1411)">
            <button class="unlock-btn" onclick="unlockSurprise()">Unlock 💖</button>
            <p id="error-msg">Oops! Galat PIN. Phir se try karo 🥺</p>
        </div>
    </div>

    <!-- APP CONTAINER -->
    <div id="main-app">
        
        <!-- SLIDE 1: Full Background Wallpaper -->
        <div class="slide active" id="slide-1">
            <div class="content-overlay">
                <div class="date-bubble">14 • 11</div>
                <h1 class="title">Happy Birthday</h1>
                <h2 class="subtitle">Tingu Mingu 🌸🥺</h2>
                
                <button class="tribute-btn" onclick="goToSlide(2)">
                    Start the tribute ➜
                </button>
            </div>
        </div>

        <!-- SLIDE 2: NEW MEMORY PAGE -->
        <div class="slide" id="slide-2">
            <h2>Our Memories 📸</h2>
            
            <img src="memory1.jpeg" alt="Our Memory" class="slide-img">
            
            <p class="memory-text">
                Sabse cute pagal! Aise hi humesha haste rehna ✨
            </p>

            <button class="tribute-btn" onclick="goToSlide(3)">
                Next Surprise ➜
            </button>
        </div>

        <!-- SLIDE 3 (Future) -->
        <div class="slide" id="slide-3">
            <h2>Next Page 🎉</h2>
        </div>

        <!-- DOTS -->
        <div class="dots-container">
            <div class="dot active" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div> 
            <div class="dot" id="dot-4"></div> 
        </div>
    </div>

    <script>
        function unlockSurprise() {
            var password = document.getElementById("pwd").value;
            if (password === "1411") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-app").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function goToSlide(slideNumber) {
            let allSlides = document.querySelectorAll('.slide');
            allSlides.forEach(slide => slide.classList.remove('active'));

            let allDots = document.querySelectorAll('.dot');
            allDots.forEach(dot => dot.classList.remove('active'));

            document.getElementById('slide-' + slideNumber).classList.add('active');
            document.getElementById('dot-' + slideNumber).classList.add('active');
        }
    </script>

</body>
</html>
